<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE PACK — Secure Admin Portal</title>
  <style>
    body {
      background: #0A0C11; color: #EDEFF4; font-family: sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;
    }
    .box { width: 100%; max-width: 320px; text-align: center; padding: 20px; }
    input, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; box-sizing: border-box; }
    input { background: #12151D; border: 1px solid #242938; color: #EDEFF4; }
    button { background: #EDEFF4; color: #0A0C11; font-weight: bold; border: none; cursor: pointer; }
    #err { color: #E2685C; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>

  <div id="gate">
    <div class="box">
      <h2>THE PACK</h2>
      <p style="color: #8992A6; font-size: 14px;">Secure Admin Gate</p>
      <input type="password" id="pw" placeholder="Enter password" autofocus>
      <button onclick="unlock()">Unlock Panel</button>
      <div id="err"></div>
    </div>
  </div>

  <script>
    // --- PASTE YOUR ENCRYPTED HEX VALUES HERE ---
    const SALT_HEX = "PASTE_YOUR_SALT_HEX_HERE";
    const IV_HEX = "PASTE_YOUR_IV_HEX_HERE";
    const CIPHER_HEX = "PASTE_YOUR_CIPHER_HEX_HERE";
    // --------------------------------------------

    function hexToBytes(hex) {
      let bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < bytes.length; i++) {
        bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
      }
      return bytes;
    }

    // Allow pressing "Enter" to submit
    document.getElementById('pw').addEventListener('keydown', e => {
      if (e.key === 'Enter') unlock();
    });

    async function unlock() {
      const password = document.getElementById("pw").value;
      const errEl = document.getElementById("err");
      errEl.textContent = "";

      if (!password) return;

      try {
        const salt = hexToBytes(SALT_HEX);
        const iv = hexToBytes(IV_HEX);
        const ciphertext = hexToBytes(CIPHER_HEX);

        // 1. Import password
        const pwKey = await window.crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(password),
          "PBKDF2",
          false,
          ["deriveKey"]
        );

        // 2. Derive Key
        const aesKey = await window.crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: salt,
            iterations: 150000,
            hash: "SHA-256"
          },
          pwKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        // 3. Decrypt
        const decryptedBuf = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          aesKey,
          ciphertext
        );

        // 4. Render the page
        const decryptedHtml = new TextDecoder().decode(decryptedBuf);
        document.open();
        document.write(decryptedHtml);
        document.close();

      } catch (err) {
        errEl.textContent = "Incorrect password or decryption failed.";
      }
    }
  </script>
</body>
</html>

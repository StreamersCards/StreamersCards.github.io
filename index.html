<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StreamerCards — collect the moment</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <button class="logo" id="logo-home-btn" aria-label="StreamerCards — go to home">
      <span class="logo-mark">SC</span>
      <span class="logo-text">Streamer<em>Cards</em></span>
    </button>

    <nav class="header-nav">
      <button class="nav-link" id="nav-home-btn">← Back to home</button>
    </nav>

    <div class="header-search">
      <input type="search" id="search-input" placeholder="Search cards…" aria-label="Search cards" />
    </div>
  </div>

  <div class="breadcrumb" id="breadcrumb" hidden>
    <button id="breadcrumb-home">Home</button>
    <span class="crumb-sep">/</span>
    <span id="breadcrumb-current"></span>
  </div>
</header>

<main id="app">
  <!-- HOME VIEW: collection tiles -->
  <section id="home-view" class="view">
    <div class="hero">
      <h1>Every clip. Every clutch. <span class="hero-accent">Collect the moment.</span></h1>
      <p class="hero-sub">Browse every set below, or jump straight to a rarity you're hunting for.</p>
    </div>

    <div class="rarity-legend" id="rarity-legend" aria-label="Rarity legend"></div>

    <h2 class="section-label">Collections</h2>
    <div class="collections-grid" id="collections-grid"></div>
  </section>

  <!-- SET VIEW: cards inside a chosen collection -->
  <section id="set-view" class="view" hidden>
    <div class="set-header">
      <h2 id="set-title"></h2>
      <p id="set-tagline"></p>
    </div>

    <div class="rarity-filter" id="rarity-filter"></div>

    <div class="cards-grid" id="cards-grid"></div>
  </section>
</main>

<!-- CARD DETAIL MODAL -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <div class="modal-art" id="modal-art"></div>
    <div class="modal-info">
      <span class="modal-rarity" id="modal-rarity"></span>
      <h3 id="modal-name"></h3>
      <p class="modal-number" id="modal-number"></p>
      <p class="modal-desc" id="modal-desc"></p>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p>StreamerCards — built for creators, one pull at a time.</p>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
